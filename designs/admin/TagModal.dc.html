<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manage tags</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: fixed; inset: 0; z-index: 50; box-sizing: border-box; padding: 16px; background: rgba(17,17,17,0.55); display: flex; align-items: center; justify-content: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #111111">
<div role="dialog" aria-modal="true" aria-labelledby="tm-title" style="width: 100%; max-width: 560px; max-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #111111; box-shadow: 0 24px 60px rgba(0,0,0,0.3)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid #D9D9D6">
<h2 id="tm-title" style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 26px">{{title}}</h2>
<button type="button" aria-label="Close" onClick="{{close}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #111111; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14"></path><path d="M19 5L5 19"></path></svg></button>
</div>
<div style="padding: 18px 20px; border-bottom: 1px solid #D9D9D6; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #4A4A4A">{{intro}}</p>
<form onSubmit="{{add}}" style="display: flex; gap: 8px">
<label for="tm-new" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">New tag name</label>
<input id="tm-new" type="text" placeholder="New tag name" value="{{draft}}" onChange="{{setDraft}}" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #111111">
<button type="submit" style="height: 44px; padding: 0 18px; border: 0; border-radius: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Add tag</button>
</form>
<sc-if value="{{hasStatus}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 13px; color: #111111">{{status}}</p></sc-if>
</div>
<ul style="list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1 1 auto">
<sc-for list="{{items}}" as="t" hint-placeholder-count="6">
<li style="border-bottom: 1px solid #ECEBE7">
<sc-if value="{{t.viewing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 20px">
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #5D7AA5">{{t.name}}</span>
<span style="font-size: 13px; color: #555555">{{t.usage}}</span>
</div>
<button type="button" onClick="{{t.startRename}}" aria-label="Rename {{t.name}}" title="Rename" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D9D6; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
<button type="button" onClick="{{t.askDelete}}" aria-label="Delete {{t.name}}" title="Delete" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D9D6; background: #FFFFFF; color: #A3152A; font-family: inherit; font-size: 14px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{t.editing}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{t.saveRename}}" style="display: flex; align-items: center; gap: 8px; padding: 8px 20px; background: #FAFAF8">
<label for="tm-ren-{{t.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rename {{t.name}}</label>
<input id="tm-ren-{{t.id}}" type="text" value="{{t.editValue}}" onChange="{{t.setEdit}}" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 15px; background: #FFFFFF; color: #111111">
<button type="submit" style="height: 44px; padding: 0 14px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Save</button>
<button type="button" onClick="{{t.cancel}}" style="height: 44px; padding: 0 14px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; cursor: pointer">Cancel</button>
</form>
</sc-if>
<sc-if value="{{t.confirming}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 20px; background: #FBF3F4">
<p style="margin: 0; flex: 1 1 200px; font-size: 14px; line-height: 1.45">{{t.warning}}</p>
<button type="button" onClick="{{t.confirmDelete}}" style="height: 44px; padding: 0 14px; border: 0; background: #A3152A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Delete tag</button>
<button type="button" onClick="{{t.cancel}}" style="height: 44px; padding: 0 14px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; cursor: pointer">Keep</button>
</div>
</sc-if>
</li>
</sc-for>
</ul>
<div style="display: flex; justify-content: flex-end; padding: 16px 20px">
<button type="button" onClick="{{close}}" style="min-height: 44px; padding: 0 22px; border: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Done</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["release","coverage"],"default":"release"},"tags":{"editor":null},"onChange":{"editor":null},"onClose":{"editor":null},"$preview":{"width":640,"height":760}}'>
class Component extends DCLogic {
  sample(kind) {
    const rows = kind === 'coverage'
      ? [['Interview', 3], ['Review', 4], ['Feature', 2], ['Roundup', 2], ['Profile', 0]]
      : [['Broadway', 4], ['Off-Broadway', 2], ['Music', 5], ['Tour', 1], ['Awards', 1], ['Announcement', 0]];
    return rows.map((r, i) => ({ id: kind[0] + i, name: r[0], count: r[1] }));
  }
  tagsNow(kind) {
    if (this.props.tags) return this.props.tags;
    const st = this.state || {};
    return st.local || this.sample(kind);
  }
  commit(next, info) {
    if (this.props.onChange) this.props.onChange(next, info);
    else this.setState({ local: next });
  }
  renderVals() {
    const kind = this.props.kind ?? 'release';
    const s = Object.assign({ draft: '', editId: null, editValue: '', confirmId: null, status: '' }, this.state || {});
    const list = this.tagsNow(kind);
    const noun = kind === 'coverage' ? 'coverage post' : 'release';
    const plural = kind === 'coverage' ? 'coverage posts' : 'releases';
    const cancel = () => this.setState({ editId: null, confirmId: null });
    return {
      title: kind === 'coverage' ? 'Coverage Tags' : 'Release Tags',
      intro: 'These are the choices in the Tag menu. Renaming a tag updates every ' + noun + ' that uses it.',
      draft: s.draft,
      status: s.status,
      hasStatus: !!s.status,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      close: () => { if (this.props.onClose) this.props.onClose(); },
      add: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const nm = (this.state && this.state.draft || '').trim();
        if (!nm) return;
        const cur = this.tagsNow(kind);
        if (cur.some((x) => x.name.toLowerCase() === nm.toLowerCase())) { this.setState({ status: nm + ' already exists.' }); return; }
        this.commit(cur.concat([{ id: 'n' + Date.now(), name: nm, count: 0 }]));
        this.setState({ draft: '', status: 'Added ' + nm + '.' });
      },
      items: list.map((t) => {
        const editing = s.editId === t.id;
        const confirming = s.confirmId === t.id;
        const removeNow = () => {
          this.commit(this.tagsNow(kind).filter((x) => x.id !== t.id), { removed: t.name });
          this.setState({ confirmId: null, status: 'Deleted ' + t.name + '.' });
        };
        return {
          id: t.id,
          name: t.name,
          usage: t.count === 0 ? 'Not used yet' : 'Used on ' + t.count + ' ' + (t.count === 1 ? noun : plural),
          viewing: !editing && !confirming,
          editing,
          confirming,
          editValue: s.editValue,
          warning: t.name + ' is used on ' + t.count + ' ' + (t.count === 1 ? noun : plural) + '. Those will show no tag until you pick a new one.',
          setEdit: (e) => this.setState({ editValue: e.target.value }),
          cancel,
          startRename: () => this.setState({ editId: t.id, editValue: t.name, confirmId: null, status: '' }),
          saveRename: (e) => {
            if (e && e.preventDefault) e.preventDefault();
            const nm = ((this.state && this.state.editValue) || '').trim();
            if (!nm) return;
            this.commit(this.tagsNow(kind).map((x) => (x.id === t.id ? { id: x.id, name: nm, count: x.count } : x)), { from: t.name, to: nm });
            this.setState({ editId: null, status: 'Renamed ' + t.name + ' to ' + nm + '.' });
          },
          askDelete: () => { if (t.count === 0) removeNow(); else this.setState({ confirmId: t.id, editId: null, status: '' }); },
          confirmDelete: removeNow
        };
      })
    };
  }
}
</script>
</body>
</html>
