<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile: Coverage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F4F4F2}
a{color:#111111}a:hover{color:#5D7AA5}
.ph{background-color:#ECEBE7;background-image:repeating-linear-gradient(135deg,rgba(17,17,17,0.07) 0 1px,transparent 1px 12px)}
.side a:hover{color:#FFFFFF;background:#2A2A2A}
.ib:hover{background:#111111;color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #F4F4F2; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="MobileAdminHeader" active="coverage" hint-size="390px,64px"></dc-import>
<main style="padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 36px; line-height: 1">Coverage</h1>
<a href="MobileAdminCoverage.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Add Coverage</a>
</div>
<div role="group" aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 16px; border: 1px solid #111111; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button></sc-if>
<sc-if value="{{t.inactive}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="min-height: 40px; padding: 0 16px; border: 1px solid #D9D9D6; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; cursor: pointer">{{t.label}}</button></sc-if>
</sc-for>
</div>
<p role="status" style="margin: 0; min-height: 20px; display: flex; align-items: center; gap: 10px; font-size: 14px">{{status}}<sc-if value="{{hasUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{undoDelete}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #111111; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Undo</button></sc-if></p>
<ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #D9D9D6">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<li>
<sc-if value="{{r.normal}}" hint-placeholder-val="{{ true }}">
<div style="padding: 14px; border-bottom: 1px solid #ECEBE7; display: flex; flex-direction: column; gap: 8px">
<a href="MobileAdminCoverage.dc.html" style="font-family: Georgia, 'Times New Roman', serif; font-size: 17px; line-height: 1.3; color: #111111; text-decoration: none">{{r.headline}}</a>
<sc-if value="{{r.hasOutlet}}" hint-placeholder-val="{{ false }}"><span style="font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 14px; color: #4A4A4A">{{r.outlet}}</span></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: #4A4A4A"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5D7AA5">{{r.tag}}</span><span>{{r.date}}</span><sc-if value="{{r.isPublished}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #5D7AA5"></span>Published</span></sc-if><sc-if value="{{r.isDraft}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #4A4A4A"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #4A4A4A; box-sizing: border-box"></span>Draft</span></sc-if></div>
<div style="display: flex; gap: 6px">
<a href="MobileAdminCoverage.dc.html" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #D9D9D6; color: #111111; text-decoration: none; font-size: 14px" aria-label="Edit {{r.headline}}" title="Edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></a>
<a href="https://example.com" target="_blank" rel="noopener" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #D9D9D6; color: #111111; text-decoration: none; font-size: 14px" aria-label="View {{r.headline}}" title="View"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></a>
<button type="button" onClick="{{r.askDelete}}" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid #D9D9D6; background: #FFFFFF; color: #A3152A; font-family: inherit; font-size: 14px" aria-label="Delete {{r.headline}}" title="Delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button>
</div>
</div>
</sc-if>
<sc-if value="{{r.confirming}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 14px; background: #FBF3F4; border-bottom: 1px solid #ECEBE7">
<p style="margin: 0; flex: 1 1 260px; font-size: 14px; line-height: 1.45">Delete “{{r.headline}}”? It will be removed from the website.</p>
<button type="button" onClick="{{r.doDelete}}" style="min-height: 44px; padding: 0 16px; border: 0; background: #A3152A; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Delete coverage</button>
<button type="button" onClick="{{r.cancelDelete}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; cursor: pointer">Keep</button>
</div>
</sc-if>
</li>
</sc-for>
</ul>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 32px 20px; font-size: 15px; color: #4A4A4A">Nothing here yet.</p></sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1190}}'>
class Component extends DCLogic {
  defaults() {
    if (!this._d) this._d = { items: [{"id": "c1", "headline": "[Headline as published by the outlet]", "tag": "Interview", "date": "October 8, 2026", "status": "Draft", "outlet": "[Outlet Name]"}, {"id": "c2", "headline": "[Artist Name] on the Making of “[Album Title]”", "tag": "Interview", "date": "September 30, 2026", "status": "Published", "outlet": "[Outlet Name]"}, {"id": "c3", "headline": "Review: [Show Title] at the [Theatre Name]", "tag": "Review", "date": "September 22, 2026", "status": "Published", "outlet": "[Outlet Name]"}, {"id": "c4", "headline": "[Number] Shows to See This Fall, Including [Show Title]", "tag": "Roundup", "date": "September 12, 2026", "status": "Published", "outlet": "[Outlet Name]"}, {"id": "c5", "headline": "Inside the Rehearsal Room of [Show Title]", "tag": "Feature", "date": "September 2, 2026", "status": "Published", "outlet": "[Outlet Name]"}, {"id": "c6", "headline": "[Headline as published by the outlet]", "tag": "Profile", "date": "August 25, 2026", "status": "Published", "outlet": "[Outlet Name]"}], filter: 'all', confirmId: null, undo: null, status: '' };
    return this._d;
  }
  cur() { return Object.assign({}, this.defaults(), this.state || {}); }
  renderVals() {
    const s = this.cur();
    const all = s.items;
    const nPub = all.filter((x) => x.status === 'Published').length;
    const nDraft = all.length - nPub;
    const shown = all.filter((x) => s.filter === 'all' || (s.filter === 'published' ? x.status === 'Published' : x.status === 'Draft'));
    const tab = (key, label) => ({ label, active: s.filter === key, inactive: s.filter !== key, pressed: s.filter === key ? 'true' : 'false', pick: () => this.setState({ filter: key, confirmId: null }) });
    return {
      tabs: [tab('all', 'All (' + all.length + ')'), tab('published', 'Published (' + nPub + ')'), tab('draft', 'Drafts (' + nDraft + ')')],
      status: s.status,
      hasUndo: !!s.undo,
      isEmpty: shown.length === 0,
      undoDelete: () => {
        const st = this.cur(); if (!st.undo) return;
        const arr = st.items.slice(); arr.splice(st.undo.index, 0, st.undo.item);
        this.setState({ items: arr, undo: null, status: 'Restored.' });
      },
      rows: shown.map((x) => ({
        headline: x.headline, tag: x.tag, date: x.date, status: x.status, outlet: x.outlet, hasOutlet: !!x.outlet,
        isPublished: x.status === 'Published', isDraft: x.status !== 'Published',
        confirming: s.confirmId === x.id, normal: s.confirmId !== x.id,
        askDelete: () => this.setState({ confirmId: x.id }),
        cancelDelete: () => this.setState({ confirmId: null }),
        doDelete: () => {
          const st = this.cur(); const idx = st.items.findIndex((y) => y.id === x.id);
          this.setState({ items: st.items.filter((y) => y.id !== x.id), confirmId: null, undo: { item: x, index: idx }, status: 'Deleted “' + x.headline + '”.' });
        }
      }))
    };
  }
}
</script>
</body>
</html>
