<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile: Clients</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F4F4F2}
.ph{background-color:#ECEBE7;background-image:repeating-linear-gradient(135deg,rgba(17,17,17,0.07) 0 1px,transparent 1px 12px)}
.ib:disabled{opacity:0.35}
input:focus{outline:2px solid #5D7AA5;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #F4F4F2; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="MobileAdminHeader" active="clients" hint-size="390px,64px"></dc-import>
<main style="padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h1 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 36px; line-height: 1">Clients</h1>
<a href="#m-add" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; background: #111111; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Add client</a>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #4A4A4A">Use the arrows to set the order on the Clients page. The top client shows first.</p>
<p role="status" style="margin: 0; min-height: 20px; display: flex; align-items: center; gap: 10px; font-size: 14px">{{status}}<sc-if value="{{hasUndo}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{undoRemove}}" style="min-height: 36px; padding: 0 12px; border: 1px solid #111111; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Undo</button></sc-if></p>
</header>
<ol style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #D9D9D6">
<sc-for list="{{items}}" as="c" hint-placeholder-count="8">
<li style="padding: 12px 14px; border-bottom: 1px solid #ECEBE7; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: none; width: 22px; font-size: 13px; font-weight: 600; color: #4A4A4A; font-variant-numeric: tabular-nums">{{c.num}}</span>
<div class="ph" aria-hidden="true" style="flex: none; width: 48px; height: 48px"></div>
<div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: Georgia, 'Times New Roman', serif; font-size: 17px">{{c.name}}</span>
<span style="font-size: 12px; color: #555555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.url}}</span>
</div>
</div>
<div style="display: flex; gap: 6px; padding-left: 34px">
<button class="ib" type="button" aria-label="Move {{c.name}} up" disabled="{{c.upDisabled}}" onClick="{{c.up}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D9D6; background: #FFFFFF; color: #111111"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button class="ib" type="button" aria-label="Move {{c.name}} down" disabled="{{c.downDisabled}}" onClick="{{c.down}}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D9D6; background: #FFFFFF; color: #111111"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button type="button" onClick="{{c.edit}}" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #D9D9D6; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px" aria-label="Edit {{c.name}}" title="Edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg></button>
<button type="button" onClick="{{c.remove}}" style="flex: 1 1 0; display: flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #D9D9D6; background: #FFFFFF; color: #A3152A; font-family: inherit; font-size: 14px" aria-label="Remove {{c.name}}" title="Remove"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button>
</div>
</li>
</sc-for>
</ol>
<section id="m-add" aria-labelledby="m-form-title" style="padding: 18px 16px; background: #FFFFFF; border: 1px solid #D9D9D6">
<form onSubmit="{{save}}" style="display: flex; flex-direction: column; gap: 16px">
<h2 id="m-form-title" style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 22px">{{formTitle}}</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ma-name" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Client name</label>
<input id="ma-name" type="text" required="required" value="{{name}}" onChange="{{setName}}" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ma-url" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Website link</label>
<input id="ma-url" type="url" inputmode="url" placeholder="https://" value="{{url}}" onChange="{{setUrl}}" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="ma-img" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Square image</label>
<input id="ma-img" type="file" accept="image/*" style="font-family: inherit; font-size: 14px">
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #555555">Pick from your photos. At least 800 × 800 px.</p>
</div>
<button type="submit" style="min-height: 48px; border: 0; border-radius: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">{{submitLabel}}</button>
<sc-if value="{{isEditing}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{cancel}}" style="min-height: 48px; border: 1px solid #111111; border-radius: 0; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 15px">Cancel</button></sc-if>
</form>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  defaults() {
    if (!this._defaults) {
      const clients = [];
      for (let i = 1; i <= 8; i++) {
        const n = String(i).padStart(2, '0');
        clients.push({ id: 'c' + n, name: '[Client ' + n + ']', url: 'https://[client-' + n + '-website].com' });
      }
      this._defaults = { clients, name: '', url: '', editingId: null, status: '', undo: null };
    }
    return this._defaults;
  }
  cur() {
    return Object.assign({}, this.defaults(), this.state || {});
  }
  renderVals() {
    const s = this.cur();
    const list = s.clients;
    const move = (from, to) => {
      const arr = this.cur().clients.slice();
      if (to < 0 || to >= arr.length || from === to || from < 0) return;
      const moved = arr.splice(from, 1)[0];
      arr.splice(to, 0, moved);
      this.setState({ clients: arr, undo: null, status: 'Order saved.' });
    };
    const items = list.map((c, i) => ({
      name: c.name,
      url: c.url,
      num: String(i + 1).padStart(2, '0'),
      upDisabled: i === 0,
      downDisabled: i === list.length - 1,
      up: () => move(i, i - 1),
      down: () => move(i, i + 1),
      edit: () => this.setState({ editingId: c.id, name: c.name, url: c.url, status: '' }),
      remove: () => {
        const st = this.cur();
        const idx = st.clients.findIndex((x) => x.id === c.id);
        this.setState({ clients: st.clients.filter((x) => x.id !== c.id), undo: { item: c, index: idx }, status: 'Removed ' + c.name + '.', editingId: st.editingId === c.id ? null : st.editingId });
      }
    }));
    const isEditing = !!s.editingId;
    return {
      items,
      status: s.status,
      hasUndo: !!s.undo,
      name: s.name,
      url: s.url,
      isEditing,
      formTitle: isEditing ? 'Edit Client' : 'Add a Client',
      submitLabel: isEditing ? 'Save changes' : 'Add client',
      setName: (e) => this.setState({ name: e.target.value }),
      setUrl: (e) => this.setState({ url: e.target.value }),
      cancel: () => this.setState({ editingId: null, name: '', url: '' }),
      undoRemove: () => {
        const st = this.cur();
        if (!st.undo) return;
        const arr = st.clients.slice();
        arr.splice(st.undo.index, 0, st.undo.item);
        this.setState({ clients: arr, undo: null, status: 'Restored ' + st.undo.item.name + '.' });
      },
      save: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const st = this.cur();
        const nm = (st.name || '').trim();
        if (!nm) return;
        if (st.editingId) {
          this.setState({ clients: st.clients.map((x) => (x.id === st.editingId ? { id: x.id, name: nm, url: st.url } : x)), editingId: null, name: '', url: '', undo: null, status: 'Saved changes to ' + nm + '.' });
        } else {
          this.setState({ clients: [{ id: 'n' + Date.now(), name: nm, url: st.url }].concat(st.clients), name: '', url: '', undo: null, status: 'Added ' + nm + ' to the top.' });
        }
      }
    };
  }
}
</script>
</body>
</html>
