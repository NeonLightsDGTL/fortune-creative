<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin mobile: Add coverage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F4F4F2}
input:focus,textarea:focus,select:focus{outline:2px solid #5D7AA5;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #F4F4F2; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="MobileAdminHeader" active="coverage" hint-size="390px,64px"></dc-import>
<form onSubmit="{{publish}}">
<main style="padding: 24px 16px 32px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<a href="MobileAdminCoverageList.dc.html" style="display: inline-flex; align-items: center; min-height: 32px; font-size: 13px; color: #4A4A4A">← All coverage</a>
<h1 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 36px; line-height: 1">Add Coverage</h1>
<p role="status" style="margin: 0; font-size: 14px; color: #4A4A4A">{{statusText}}</p>
<div style="align-self: flex-start"><button type="button" onClick="{{askDelete}}" aria-label="Delete this coverage" title="Delete" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #D9D9D6; background: #FFFFFF; color: #A3152A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg></button></div>
<sc-if value="{{confirmDelete}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 14px 18px; background: #FBF3F4; border: 1px solid #E8C9CE">
<p style="margin: 0; flex: 1 1 240px; font-size: 14px; line-height: 1.45">Delete this coverage post? It will be removed from the website.</p>
<a href="MobileAdminCoverageList.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; background: #A3152A; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">Delete coverage</a>
<button type="button" onClick="{{cancelDelete}}" style="min-height: 44px; padding: 0 16px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 14px; cursor: pointer">Keep</button>
</div>
</sc-if>
</div>
<div style="padding: 18px 16px; background: #FFFFFF; border: 1px solid #D9D9D6; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mv-url" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Link to the article</label>
<input id="mv-url" type="url" inputmode="url" required="required" placeholder="Paste the link" value="{{url}}" onChange="{{setUrl}}" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mv-head" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Headline</label>
<input id="mv-head" type="text" required="required" value="{{headline}}" onChange="{{setHeadline}}" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: Georgia, 'Times New Roman', serif; font-size: 18px; background: #FFFFFF; color: #111111">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mv-outlet" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Outlet</label>
<input id="mv-outlet" type="text" required="required" value="{{outlet}}" onChange="{{setOutlet}}" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
</div>
<div style="display: flex; gap: 12px">
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="mv-date" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; min-height: 32px">Date</label>
<input id="mv-date" type="date" value="{{dateValue}}" onChange="{{setDate}}" style="height: 48px; box-sizing: border-box; padding: 0 8px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
</div>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 32px; gap: 8px"><label for="mv-cat" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Tag</label><button type="button" onClick="{{openTags}}" style="min-height: 28px; padding: 0; border: 0; background: transparent; color: #4A4A4A; font-family: inherit; font-size: 13px; text-decoration: underline">Manage</button></div>
<select id="mv-cat" value="{{category}}" onChange="{{setCategory}}" style="height: 48px; box-sizing: border-box; padding: 0 8px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
<sc-for list="{{tagOptions}}" as="o" hint-placeholder-count="5"><option value="{{o.name}}">{{o.name}}</option></sc-for>
</select>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="mv-thumb" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Thumbnail image</label>
<input id="mv-thumb" type="file" accept="image/*" style="font-family: inherit; font-size: 14px">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px"><label for="mv-blurb" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Short blurb</label><span style="font-size: 13px; color: #555555; font-variant-numeric: tabular-nums">{{blurbCount}} / 240</span></div>
<textarea id="mv-blurb" rows="4" maxlength="240" value="{{blurb}}" onChange="{{setBlurb}}" style="box-sizing: border-box; padding: 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; line-height: 1.5; background: #FFFFFF; color: #111111; resize: vertical"></textarea>
</div>
</div>
</main>
<div style="position: sticky; bottom: 0; display: flex; gap: 10px; padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #111111">
<button type="button" onClick="{{saveDraft}}" style="flex: 1 1 0; min-height: 48px; border: 1px solid #111111; border-radius: 0; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 15px; font-weight: 600">Save draft</button>
<button type="submit" style="flex: 1 1 0; min-height: 48px; border: 0; border-radius: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">Publish</button>
</div>
</form>
<sc-if value="{{tagsOpen}}" hint-placeholder-val="{{ false }}"><dc-import name="TagModal" kind="coverage" tags="{{tags}}" on-change="{{setTags}}" on-close="{{closeTags}}" hint-size="0px,0px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":978}}'>
class Component extends DCLogic {
  sampleTags() {
    if (!this._tags) this._tags = [['Interview', 3], ['Review', 4], ['Feature', 2], ['Roundup', 2], ['Profile', 0]].map((r, i) => ({ id: 't' + i, name: r[0], count: r[1] }));
    return this._tags;
  }
  cur() {
    return Object.assign({ tags: this.sampleTags(), tagsOpen: false, url: '', headline: '', outlet: '', dateValue: '2026-10-06', category: 'Interview', blurb: '', status: 'Draft, not published' }, this.state || {});
  }
  renderVals() {
    const s = this.cur();
    return {
      url: s.url, headline: s.headline, outlet: s.outlet, dateValue: s.dateValue, category: s.category, blurb: s.blurb,
      blurbCount: (s.blurb || '').length,
      statusText: s.status,
      confirmDelete: !!(this.state && this.state.confirmDelete),
      askDelete: () => this.setState({ confirmDelete: true }),
      cancelDelete: () => this.setState({ confirmDelete: false }),
      tags: s.tags,
      tagOptions: s.tags,
      tagsOpen: s.tagsOpen,
      openTags: () => this.setState({ tagsOpen: true }),
      closeTags: () => this.setState({ tagsOpen: false }),
      setTags: (next, info) => {
        const st = this.cur();
        let category = st.category;
        if (info && info.from === category) category = info.to;
        if (!next.some((t) => t.name === category)) category = next.length ? next[0].name : '';
        this.setState({ tags: next, category });
      },
      setUrl: (e) => this.setState({ url: e.target.value }),
      setHeadline: (e) => this.setState({ headline: e.target.value }),
      setOutlet: (e) => this.setState({ outlet: e.target.value }),
      setDate: (e) => this.setState({ dateValue: e.target.value }),
      setCategory: (e) => this.setState({ category: e.target.value }),
      setBlurb: (e) => this.setState({ blurb: e.target.value }),
      saveDraft: () => this.setState({ status: 'Draft saved' }),
      publish: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ status: 'Published to Coverage' }); }
    };
  }
}
</script>
</body>
</html>
