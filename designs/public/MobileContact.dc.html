<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Creative mobile: Contact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF}
input:focus{outline:2px solid #5D7AA5;outline-offset:1px}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="MobileHeader" active="contact" hint-size="390px,72px"></dc-import>
<main style="padding: 32px 20px 64px; display: flex; flex-direction: column; gap: 28px">
<h1 style="margin: 0; padding-bottom: 16px; border-bottom: 1px solid #111111; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 44px; line-height: 1">Contact</h1>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="flex: 0 0 auto; box-sizing: border-box; padding: 20px; border: 1px solid #111111; display: flex; gap: 16px; align-items: flex-start;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Phone</span><a href="tel:+19176081309" style="font-family: Georgia, 'Times New Roman', serif; font-size: 19px; overflow-wrap: anywhere; color: #111111; text-decoration: none">(917) 608-1309</a></span>
</div>
<div style="flex: 0 0 auto; box-sizing: border-box; padding: 20px; border: 1px solid #111111; display: flex; gap: 16px; align-items: flex-start;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><rect x="3" y="5" width="18" height="14" rx="1"></rect><path d="M3 7l9 6 9-6"></path></svg>
<span style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Email</span><a href="mailto:dan@fortunecreative.com" style="font-family: Georgia, 'Times New Roman', serif; font-size: 19px; overflow-wrap: anywhere; color: #111111; text-decoration: none">dan@fortunecreative.com</a>
<button type="button" onClick="{{openPrompt}}" style="margin-top: 10px; align-self: flex-start; min-height: 48px; padding: 0 24px; border: 0; border-radius: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Email me</button></span>
</div>
</div>
</main>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}">
<div style="position: fixed; inset: 0; z-index: 50; box-sizing: border-box; padding: 16px; background: rgba(17,17,17,0.55); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="em-title" style="width: 100%; max-width: 480px; box-sizing: border-box; padding: 28px; background: #FFFFFF; border: 1px solid #111111; box-shadow: 0 24px 60px rgba(0,0,0,0.3)">
<form onSubmit="{{go}}" style="display: flex; flex-direction: column; gap: 18px">
<h2 id="em-title" style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 28px; line-height: 1.15">What project is this about?</h2>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="em-project" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Project name</label>
<input id="em-project" type="text" required="required" autoFocus="autofocus" value="{{project}}" onChange="{{setProject}}" placeholder="Show, album, or event" style="height: 48px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 16px; background: #FFFFFF; color: #111111">
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #555555">Your email app will open with a message to Dan, subject: NEW BUSINESS INQUIRY: {{previewName}}</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="submit" style="flex: 1 1 auto; min-height: 48px; padding: 0 22px; border: 0; border-radius: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Open email</button>
<button type="button" onClick="{{close}}" style="flex: 0 0 auto; min-height: 48px; padding: 0 22px; border: 1px solid #111111; border-radius: 0; background: #FFFFFF; color: #111111; font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer">Cancel</button>
</div>
</form>
</div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showPrompt":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  cur() {
    return Object.assign({ open: !!this.props.showPrompt, project: '' }, this.state || {});
  }
  renderVals() {
    const s = this.cur();
    return {
      open: s.open,
      project: s.project,
      previewName: (s.project || '').trim() || '[your project]',
      openPrompt: () => this.setState({ open: true }),
      close: () => this.setState({ open: false }),
      setProject: (e) => this.setState({ project: e.target.value }),
      go: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        const name = (this.cur().project || '').trim();
        if (!name) return;
        const subject = encodeURIComponent('NEW BUSINESS INQUIRY: ' + name);
        this.setState({ open: false, project: '' });
        window.location.href = 'mailto:dan@fortunecreative.com?subject=' + subject;
      }
    };
  }
}
</script>
</body>
</html>
