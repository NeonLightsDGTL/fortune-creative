<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Creative: Releases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#5D7AA5}
.ph{background-color:#ECEBE7;background-image:repeating-linear-gradient(135deg,rgba(17,17,17,0.07) 0 1px,transparent 1px 12px)}
.btn:hover{background:#111111;color:#FFFFFF}
</style>
</helmet>
<div style="width: 100%; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="SiteHeader" active="releases" hint-size="100%,160px"></dc-import>
<main style="max-width: 1280px; margin: 0 auto; padding: 64px 32px 96px; box-sizing: border-box">
<div style="padding-bottom: 24px; border-bottom: 1px solid #111111">
<h1 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.01em">Releases</h1>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{releases}}" as="r" hint-placeholder-count="5">
<article style="display: flex; flex-wrap: wrap; gap: 24px 40px; padding: 40px 0; border-bottom: 1px solid #D9D9D6">
<a href="ReleaseDetail.dc.html" tabindex="-1" aria-hidden="true" class="ph" style="flex: 0 1 340px; min-width: 240px; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Thumbnail</a>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
<p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">
<span style="color: #5D7AA5">{{r.category}}</span>
<span aria-hidden="true" style="width: 1px; height: 12px; background: #8A8A8A"></span>
<time style="color: #4A4A4A">{{r.date}}</time>
</p>
<h2 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 32px; line-height: 1.18; text-wrap: pretty"><a href="ReleaseDetail.dc.html" style="color: inherit; text-decoration: none">{{r.headline}}</a></h2>
<p style="margin: 0; max-width: 680px; font-size: 17px; line-height: 1.55; color: #4A4A4A">{{r.blurb}}</p>
<a class="btn" href="ReleaseDetail.dc.html" style="margin-top: 6px; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 20px; border: 1px solid #111111; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Read full release<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</div>
</article>
</sc-for>
</div>
<nav aria-label="Release pages" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 32px">
<span style="font-size: 14px; color: #4A4A4A">Page 1 of [N]</span>
<a href="Releases.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #111111; font-size: 14px; font-weight: 600">Older releases</a>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2040}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      releases: [
        { category: 'Broadway', date: 'October 1, 2026', headline: '[Show Title] Announces Broadway Opening Night at the [Theatre Name]', blurb: 'Previews begin [date] ahead of an official opening on [date]. Tickets go on sale [date] through [ticketing partner].' },
        { category: 'Music', date: 'September 24, 2026', headline: '[Artist Name] Releases New Album “[Album Title]”', blurb: '[One to two sentences on the album: label, producer, lead single, and where to listen.]' },
        { category: 'Awards', date: 'September 15, 2026', headline: '[Production] Receives [Number] [Award] Nominations', blurb: '[One to two sentences listing the nominated categories and the ceremony date.]' },
        { category: 'Off-Broadway', date: 'September 3, 2026', headline: '[Show Title] Extends Run at [Venue] Through [Date]', blurb: '[One to two sentences on the extension, cast changes, and ticket availability.]' },
        { category: 'Tour', date: 'August 20, 2026', headline: '[Artist Name] Announces [Year] North American Tour', blurb: '[One to two sentences on the routing, support acts, and presale dates.]' }
      ]
    };
  }
}
</script>
</body>
</html>
