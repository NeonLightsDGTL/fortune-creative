<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Creative mobile: Releases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF}
.ph{background-color:#ECEBE7;background-image:repeating-linear-gradient(135deg,rgba(17,17,17,0.07) 0 1px,transparent 1px 12px)}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="MobileHeader" active="releases" hint-size="390px,72px"></dc-import>
<main style="padding: 32px 20px 64px">
<h1 style="margin: 0; padding-bottom: 16px; border-bottom: 1px solid #111111; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 44px; line-height: 1">Releases</h1>
<div style="display: flex; flex-direction: column">
<sc-for list="{{releases}}" as="r" hint-placeholder-count="5">
<article style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-bottom: 1px solid #D9D9D6">
<a href="MobileRelease.dc.html" tabindex="-1" aria-hidden="true" class="ph" style="aspect-ratio: 4 / 3; width: 100%"></a>
<p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase"><span style="color: #5D7AA5">{{r.category}}</span><time style="color: #4A4A4A">{{r.date}}</time></p>
<h2 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 24px; line-height: 1.2"><a href="MobileRelease.dc.html" style="color: inherit; text-decoration: none">{{r.headline}}</a></h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4A4A4A">{{r.blurb}}</p>
<a href="MobileRelease.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border: 1px solid #111111; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Read full release<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></a>
</article>
</sc-for>
</div>
<nav aria-label="Release pages" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px">
<span style="font-size: 14px; color: #4A4A4A">Page 1 of [N]</span>
<a href="MobileReleases.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #111111; font-size: 14px; font-weight: 600">Older releases</a>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":3038}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      releases: [
        { category: 'Broadway', date: 'October 1, 2026', headline: '[Show Title] Announces Broadway Opening Night at the [Theatre Name]', blurb: 'Previews begin [date] ahead of an official opening on [date]. Tickets go on sale [date] through [ticketing partner].' },
        { category: 'Music', date: 'September 24, 2026', headline: '[Artist Name] Releases New Album “[Album Title]”', blurb: '[One to two sentences on the album: label, producer, lead single, and where to listen.]' },
        { category: 'Awards', date: 'September 15, 2026', headline: '[Production] Receives [Number] [Award] Nominations', blurb: '[One to two sentences listing the nominated categories and the ceremony date.]' },
        { category: 'Off-Broadway', date: 'September 3, 2026', headline: '[Show Title] Extends Run at [Venue] Through [Date]', blurb: '[One to two sentences on the extension, cast changes, and ticket availability.]' },
        { category: 'Tour', date: 'August 20, 2026', headline: '[Artist Name] Announces [Year] North American Tour', blurb: '[One to two sentences on the routing, support acts, and presale dates.]' }
      ]
    };
  }
}
</script>
</body>
</html>
