<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Creative: Coverage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#5D7AA5}
.ph{background-color:#ECEBE7;background-image:repeating-linear-gradient(135deg,rgba(17,17,17,0.07) 0 1px,transparent 1px 12px)}
.btn:hover{background:#111111;color:#FFFFFF}
</style>
</helmet>
<div style="width: 100%; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="SiteHeader" active="coverage" hint-size="100%,160px"></dc-import>
<main style="max-width: 1280px; margin: 0 auto; padding: 64px 32px 96px; box-sizing: border-box">
<div style="padding-bottom: 24px; border-bottom: 1px solid #111111">
<h1 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 64px; line-height: 1; letter-spacing: -0.01em">Coverage</h1>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="c" hint-placeholder-count="5">
<article style="display: flex; flex-wrap: wrap; gap: 24px 40px; padding: 40px 0; border-bottom: 1px solid #D9D9D6">
<a href="https://example.com" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true" class="ph" style="flex: 0 1 340px; min-width: 240px; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; color: #555555; text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Thumbnail</a>
<div style="flex: 999 1 420px; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
<p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">
<span style="color: #5D7AA5">{{c.category}}</span>
<span aria-hidden="true" style="width: 1px; height: 12px; background: #8A8A8A"></span>
<time style="color: #4A4A4A">{{c.date}}</time>
</p>
<p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 18px; color: #111111">{{c.outlet}}</p>
<h2 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 32px; line-height: 1.18; text-wrap: pretty"><a href="https://example.com" target="_blank" rel="noopener" style="color: inherit; text-decoration: none">{{c.headline}}</a></h2>
<p style="margin: 0; max-width: 680px; font-size: 17px; line-height: 1.55; color: #4A4A4A">{{c.blurb}}</p>
<a class="btn" href="https://example.com" target="_blank" rel="noopener" style="margin-top: 6px; display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 20px; border: 1px solid #111111; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Read full coverage<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">(opens {{c.outlet}} in a new tab)</span></a>
</div>
</article>
</sc-for>
</div>
<nav aria-label="Coverage pages" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding-top: 32px">
<span style="font-size: 14px; color: #4A4A4A">Page 1 of [N]</span>
<a href="Coverage.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #111111; font-size: 14px; font-weight: 600">Older coverage</a>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { category: 'Interview', outlet: '[Outlet Name]', date: 'September 30, 2026', headline: '[Artist Name] on the Making of “[Album Title]”', blurb: '[One to two sentences, in Dan’s words, on what the piece covers and why it matters.]' },
        { category: 'Review', outlet: '[Outlet Name]', date: 'September 22, 2026', headline: 'Review: [Show Title] at the [Theatre Name]', blurb: '[One to two sentences, ideally a short pull line from the review.]' },
        { category: 'Roundup', outlet: '[Outlet Name]', date: 'September 12, 2026', headline: '[Number] Shows to See This Fall, Including [Show Title]', blurb: '[One to two sentences on which client is featured and how.]' },
        { category: 'Feature', outlet: '[Outlet Name]', date: 'September 2, 2026', headline: 'Inside the Rehearsal Room of [Show Title]', blurb: '[One to two sentences on the angle of the feature.]' },
        { category: 'Profile', outlet: '[Outlet Name]', date: 'August 25, 2026', headline: '[Headline as published by the outlet]', blurb: '[One to two sentences on the profile subject and angle.]' }
      ]
    };
  }
}
</script>
</body>
</html>
