<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Creative header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<div style="max-width: 1280px; margin: 0 auto; padding: 20px 32px 18px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px 48px">
<a href="Main.dc.html" style="display: flex; align-items: center; min-height: 44px"><img src="/_blob/cb7cb2ba858c28c9c73fed16b76a7853" alt="Fortune Creative home" style="display: block; width: 300px; height: auto"></a>
<sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
<form onSubmit="{{submit}}" style="flex: 0 1 460px; min-width: 260px; display: flex; flex-direction: column; gap: 8px">
<label for="fc-list-email" style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Sign up to receive press releases</label>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<input id="fc-list-email" name="email" type="email" required="required" autocomplete="email" placeholder="you@outlet.com" style="flex: 1 1 220px; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #111111; border-radius: 0; font-family: inherit; font-size: 15px; color: #111111; background: #FFFFFF">
<button type="submit" style="flex: 0 0 auto; height: 44px; padding: 0 18px; border: 0; border-radius: 0; background: #111111; color: #FFFFFF; font-family: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer">Submit</button>
</div>
</form>
</sc-if>
<sc-if value="{{submitted}}" hint-placeholder-val="{{ false }}">
<p role="status" style="flex: 0 1 460px; min-width: 260px; margin: 0; padding: 12px 0; border-top: 1px solid #111111; border-bottom: 1px solid #111111; font-size: 15px; line-height: 1.4">Thank you for signing up for the Fortune Creative press release distribution list.</p>
</sc-if>
</div>
<nav aria-label="Main" style="border-top: 1px solid #111111; border-bottom: 4px double #111111">
<ul style="list-style: none; margin: 0 auto; max-width: 1280px; box-sizing: border-box; padding: 0 32px; display: flex; flex-wrap: wrap; gap: 0 40px">
<sc-for list="{{links}}" as="link" hint-placeholder-count="6">
<li style="display: flex">
<sc-if value="{{link.current}}" hint-placeholder-val="{{ false }}">
<a href="{{link.href}}" aria-current="page" style="display: inline-flex; align-items: center; min-height: 48px; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; box-shadow: inset 0 -3px 0 #5D7AA5">{{link.label}}</a>
</sc-if>
<sc-if value="{{link.other}}" hint-placeholder-val="{{ true }}">
<a href="{{link.href}}" style="display: inline-flex; align-items: center; min-height: 48px; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">{{link.label}}</a>
</sc-if>
</li>
</sc-for>
</ul>
</nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","clients","releases","coverage","about","contact"],"default":"home"},"$preview":{"width":1440,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const s = this.state || {};
    const links = [
      { key: 'home', label: 'Home', href: 'Main.dc.html' },
      { key: 'clients', label: 'Clients', href: 'Clients.dc.html' },
      { key: 'releases', label: 'Releases', href: 'Releases.dc.html' },
      { key: 'coverage', label: 'Coverage', href: 'Coverage.dc.html' },
      { key: 'about', label: 'About', href: 'About.dc.html' },
      { key: 'contact', label: 'Contact', href: 'Contact.dc.html' }
    ].map((l) => ({ ...l, current: l.key === active, other: l.key !== active }));
    return {
      links,
      submitted: !!s.submitted,
      showForm: !s.submitted,
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ submitted: true }); }
    };
  }
}
</script>
</body>
</html>
