<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fortune Creative mobile: Coverage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#FFFFFF}
.ph{background-color:#ECEBE7;background-image:repeating-linear-gradient(135deg,rgba(17,17,17,0.07) 0 1px,transparent 1px 12px)}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #FFFFFF; color: #111111; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif">
<dc-import name="MobileHeader" active="coverage" hint-size="390px,72px"></dc-import>
<main style="padding: 32px 20px 64px">
<h1 style="margin: 0; padding-bottom: 16px; border-bottom: 1px solid #111111; font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: 44px; line-height: 1">Coverage</h1>
<div style="display: flex; flex-direction: column">
<sc-for list="{{items}}" as="c" hint-placeholder-count="5">
<article style="display: flex; flex-direction: column; gap: 12px; padding: 28px 0; border-bottom: 1px solid #D9D9D6">
<a href="https://example.com" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true" class="ph" style="aspect-ratio: 4 / 3; width: 100%"></a>
<p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase"><span style="color: #5D7AA5">{{c.category}}</span><time style="color: #4A4A4A">{{c.date}}</time></p>
<p style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 17px">{{c.outlet}}</p>
<h2 style="margin: 0; font-family: Georgia, 'Times New Roman', serif; font-weight: 500; font-size: 24px; line-height: 1.2"><a href="https://example.com" target="_blank" rel="noopener" style="color: inherit; text-decoration: none">{{c.headline}}</a></h2>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #4A4A4A">{{c.blurb}}</p>
<a href="https://example.com" target="_blank" rel="noopener" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border: 1px solid #111111; color: #111111; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase">Read full coverage<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></a>
</article>
</sc-for>
</div>
<nav aria-label="Coverage pages" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px">
<span style="font-size: 14px; color: #4A4A4A">Page 1 of [N]</span>
<a href="MobileCoverage.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; color: #111111; font-size: 14px; font-weight: 600">Older coverage</a>
</nav>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":3156}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { category: 'Interview', outlet: '[Outlet Name]', date: 'September 30, 2026', headline: '[Artist Name] on the Making of “[Album Title]”', blurb: '[One to two sentences, in Dan’s words, on what the piece covers and why it matters.]' },
        { category: 'Review', outlet: '[Outlet Name]', date: 'September 22, 2026', headline: 'Review: [Show Title] at the [Theatre Name]', blurb: '[One to two sentences, ideally a short pull line from the review.]' },
        { category: 'Roundup', outlet: '[Outlet Name]', date: 'September 12, 2026', headline: '[Number] Shows to See This Fall, Including [Show Title]', blurb: '[One to two sentences on which client is featured and how.]' },
        { category: 'Feature', outlet: '[Outlet Name]', date: 'September 2, 2026', headline: 'Inside the Rehearsal Room of [Show Title]', blurb: '[One to two sentences on the angle of the feature.]' },
        { category: 'Profile', outlet: '[Outlet Name]', date: 'August 25, 2026', headline: '[Headline as published by the outlet]', blurb: '[One to two sentences on the profile subject and angle.]' }
      ]
    };
  }
}
</script>
</body>
</html>
